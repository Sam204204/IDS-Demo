include:
  - ./config/wazuh/wazuh.yml

services:
  suricata:
    build:
      context: ./suricata
    container_name: suricata
    network_mode: host
    depends_on:
      - curl
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    volumes:
      - ./config/suricata/suricata.yml:/etc/suricata/suricata.yaml
      - ./suricata-logs:/var/log/suricata
    command: bash -c "suricata-update --local /etc/suricata/rules/local.rules && service cron start && suricata -c /etc/suricata/suricata.yaml -i br_ids"
    
  curl:
    build:
      context: ./curl/.
    networks:
      - ids_net

networks:
  ids_net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.22.0.0/16
    driver_opts:
      com.docker.network.bridge.name: br_ids





 
